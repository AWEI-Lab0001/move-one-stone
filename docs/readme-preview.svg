<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">石头记产品界面预览</title>
  <desc id="desc">石头记今日页、任务拆分和透明水罐进度的视觉预览</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef7f3"/><stop offset="1" stop-color="#fff6dc"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a8e1d2"/><stop offset="1" stop-color="#59ad98"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#17324d" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1200" height="680" rx="36" fill="url(#bg)"/>
  <circle cx="1090" cy="80" r="165" fill="#d9efe7" opacity=".72"/>
  <circle cx="70" cy="655" r="180" fill="#ffe9ad" opacity=".55"/>

  <g transform="translate(62 42)">
    <rect width="52" height="52" rx="16" fill="#17324d"/>
    <path d="M13 37 21 15l7 14 5-10 7 18Z" fill="none" stroke="#f6bd60" stroke-width="3" stroke-linejoin="round"/>
    <text x="70" y="27" fill="#17324d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="800">石头记</text>
    <text x="71" y="47" fill="#72827a" font-family="Georgia, serif" font-size="14" font-weight="700" letter-spacing="1.2">Move One Stone</text>
  </g>
  <text x="62" y="130" fill="#425b50" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18">一天总会被填满，先放进真正重要的那一块。</text>

  <g filter="url(#shadow)">
    <rect x="62" y="165" width="740" height="452" rx="26" fill="#ffffff" fill-opacity=".9" stroke="#d9e8e2"/>
    <rect x="90" y="193" width="45" height="29" rx="9" fill="#fff0cf"/>
    <text x="103" y="213" fill="#a56b16" font-family="Arial, sans-serif" font-size="13" font-weight="700">01</text>
    <text x="151" y="215" fill="#17324d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="700">今天最重要的大石头</text>
    <rect x="90" y="241" width="684" height="62" rx="14" fill="#f6faf8" stroke="#cfe1da"/>
    <text x="111" y="268" fill="#77877f" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">我的大石头</text>
    <text x="111" y="289" fill="#17324d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="700">完成项目公开页并邀请第一批真实用户</text>

    <text x="90" y="344" fill="#17324d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700">拆成能动手的小石头</text>
    <text x="692" y="344" fill="#7b8a83" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12">重量 1–5</text>
    <g transform="translate(90 363)">
      <rect width="684" height="66" rx="15" fill="#fff" stroke="#b8ddd1"/>
      <rect x="17" y="20" width="25" height="25" rx="8" fill="#52ae96"/>
      <path d="m24 32 5 5 8-11" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="58" y="29" fill="#17324d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="700">调整中文品牌层级</text>
      <text x="58" y="51" fill="#809087" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12">让中文成为第一视觉焦点</text>
      <rect x="585" y="14" width="71" height="38" rx="12" fill="#fff4d6"/>
      <text x="617" y="39" fill="#9b650f" font-family="Arial, sans-serif" font-size="17" font-weight="700">3</text>
    </g>
    <g transform="translate(90 441)">
      <rect width="684" height="66" rx="15" fill="#fff" stroke="#d8e2de"/>
      <rect x="17" y="20" width="25" height="25" rx="8" fill="#fff" stroke="#aebfb7" stroke-width="2"/>
      <text x="58" y="29" fill="#17324d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="700">完善 GitHub 项目首页</text>
      <text x="58" y="51" fill="#809087" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12">让别人看懂，也能直接开始使用</text>
      <rect x="585" y="14" width="71" height="38" rx="12" fill="#fff4d6"/>
      <text x="617" y="39" fill="#9b650f" font-family="Arial, sans-serif" font-size="17" font-weight="700">2</text>
    </g>
    <rect x="90" y="529" width="684" height="62" rx="15" fill="#fff8e5" stroke="#efcf82"/>
    <text x="111" y="554" fill="#a36b16" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="700">现在先做什么？</text>
    <text x="111" y="578" fill="#17324d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700">先把中文标题放到最前面</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="830" y="165" width="308" height="452" rx="26" fill="#17324d"/>
    <text x="861" y="207" fill="#a7c8bd" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">TODAY</text>
    <text x="861" y="244" fill="#fff" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="700">今天留下了多少推进？</text>
    <text x="861" y="292" fill="#bdd1ca" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">大石头总进度</text>
    <text x="861" y="339" fill="#f6bd60" font-family="Arial, sans-serif" font-size="46" font-weight="700">3<tspan fill="#94aca3" font-size="22"> / 5</tspan></text>
    <rect x="861" y="356" width="246" height="9" rx="5" fill="#324c62"/>
    <rect x="861" y="356" width="148" height="9" rx="5" fill="#f6bd60"/>
    <g transform="translate(904 393)">
      <path d="M8 12h154l-11 152a22 22 0 0 1-22 20H41a22 22 0 0 1-22-20Z" fill="#f5fbf9" fill-opacity=".12" stroke="#cfe5de" stroke-width="3"/>
      <path d="M21 83h136l-6 81a22 22 0 0 1-22 20H41a22 22 0 0 1-22-20Z" fill="url(#water)" opacity=".9"/>
      <ellipse cx="85" cy="83" rx="68" ry="10" fill="#a8e1d2"/>
      <circle cx="63" cy="133" r="19" fill="#f6bd60"/>
      <circle cx="104" cy="154" r="24" fill="#d7a44d"/>
      <circle cx="119" cy="111" r="15" fill="#ffda88"/>
    </g>
  </g>
</svg>
